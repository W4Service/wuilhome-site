name: Fetch Channex Reviews

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  fetch-reviews:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch reviews from Channex API
        env:
          CHANNEX_API_KEY: ${{ secrets.CHANNEX_API_KEY }}
        run: |
          curl -s -X GET "https://app.channex.io/api/v1/reviews?pagination%5Bpage%5D=1&pagination%5Blimit%5D=100&order%5Binserted_at%5D=desc" \
            -H "Content-Type: application/json" \
            -H "user-api-key: ${CHANNEX_API_KEY}" \
            -o channex_response.json
          cat channex_response.json

      - name: Transform and filter reviews
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const response = JSON.parse(fs.readFileSync('channex_response.json', 'utf8'));
          
          const reviews = (response.data || []).map(r => {
            const attrs = r.attributes || {};
            
            // Extraire le commentaire selon la plateforme
            let comment = '';
            if (attrs.raw_content?.public_review) {
              comment = attrs.raw_content.public_review;
            } else if (attrs.raw_content?.positive) {
              comment = attrs.raw_content.positive;
            } else if (attrs.content) {
              // Nettoyer le content (enlever "Public review:" etc.)
              comment = attrs.content.replace(/^(Public review:|Headline:|Positive:|Negative:)\s*/gi, '').trim();
            }
            
            return {
              id: r.id,
              guest_name: attrs.guest_name || 'Voyageur',
              rating: attrs.overall_score || 10,
              comment: comment,
              date: attrs.received_at || attrs.inserted_at || new Date().toISOString(),
              platform: attrs.ota === 'AirBNB' ? 'Airbnb' : 'Booking'
            };
          }).filter(r => {
            // Doit avoir un commentaire
            if (!r.comment || r.comment.length < 5) return false;
            
            // Filtrer par note (sur 10)
            // Airbnb: 10/10 seulement (équivalent 5/5)
            // Booking: >= 9/10
            return r.rating >= 9;
          });
          
          // Trier par date et garder les 15 plus récents
          const sortedReviews = reviews
            .sort((a, b) => new Date(b.date) - new Date(a.date))
            .slice(0, 15);
          
          fs.writeFileSync('data/reviews.json', JSON.stringify({
            updated_at: new Date().toISOString(),
            count: sortedReviews.length,
            reviews: sortedReviews
          }, null, 2));
          
          console.log('Total reviews fetched:', response.data?.length || 0);
          console.log('Filtered reviews (rating >= 9):', sortedReviews.length);
          SCRIPT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          commit-message: "Update reviews from Channex"
          title: "🔄 Mise à jour avis Channex"
          body: "Mise à jour automatique des 15 derniers avis (note >= 9/10)"
          branch: auto-update-reviews
          delete-branch: true
