name: Fetch Channex Reviews

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  fetch-reviews:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch reviews from Channex API
        env:
          CHANNEX_API_KEY: ${{ secrets.CHANNEX_API_KEY }}
        run: |
          curl -s -X GET "https://app.channex.io/api/v1/reviews?pagination%5Bpage%5D=1&pagination%5Blimit%5D=100&order%5Binserted_at%5D=desc" \
            -H "Content-Type: application/json" \
            -H "user-api-key: ${CHANNEX_API_KEY}" \
            -o channex_response.json

      - name: Transform and filter reviews
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const response = JSON.parse(fs.readFileSync('channex_response.json', 'utf8'));
          const reviews = (response.data || []).map(r => {
            const attrs = r.attributes || {};
            let comment = '';
            if (attrs.raw_content?.public_review) {
              comment = attrs.raw_content.public_review;
            } else if (attrs.raw_content?.positive) {
              comment = attrs.raw_content.positive;
            } else if (attrs.content) {
              comment = attrs.content.replace(/^(Public review:|Headline:|Positive:|Negative:)\s*/gi, '').trim();
            }
            return {
              id: r.id,
              guest_name: attrs.guest_name || 'Voyageur',
              rating: attrs.overall_score || 10,
              comment: comment,
              date: attrs.received_at || attrs.inserted_at || new Date().toISOString(),
              platform: attrs.ota === 'AirBNB' ? 'Airbnb' : 'Booking'
            };
          }).filter(r => {
            if (!r.comment || r.comment.length < 5) return false;
            return r.rating >= 9;
          });
          const sortedReviews = reviews.sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 15);
          fs.writeFileSync('data/reviews.json', JSON.stringify({
            updated_at: new Date().toISOString(),
            count: sortedReviews.length,
            reviews: sortedReviews
          }, null, 2));
          console.log('Filtered reviews:', sortedReviews.length);
          SCRIPT

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/reviews.json
          git diff --staged --quiet || git commit -m "Update reviews from Channex"
          git push
