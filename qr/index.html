<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirection - Wuilhome</title>

    <!-- Tarteaucitron (gestion des cookies) -->
    <script src="https://cdn.jsdelivr.net/npm/tarteaucitronjs@1/tarteaucitron.min.js"></script>
    <script>
        tarteaucitron.init({
            privacyUrl: "../mentions-legales/",
            orientation: "bottom",
            showAlertSmall: false,
            cookieslist: true,
            adblocker: false,
            AcceptAllCta: true,
            highPrivacy: true,
            handleBrowserDNTRequest: false,
            removeCredit: true,
            moreInfoLink: false
        });

        // Service Google Analytics avec Consent Mode
        tarteaucitron.user.gtagUa = 'G-Q5VC23HM27';
        (tarteaucitron.job = tarteaucitron.job || []).push('gtag');
    </script>

    <!-- Consent Mode V2 - état par défaut (refus) -->
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}

        gtag('consent', 'default', {
            ad_storage: 'denied',
            analytics_storage: 'denied',
            ad_user_data: 'denied',
            ad_personalization: 'denied'
        });
    </script>

    <!-- Google Tag -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q5VC23HM27"></script>
    <script>
        gtag('js', new Date());
        gtag('config', 'G-Q5VC23HM27', {
            send_page_view: true
        });
    </script>

    <!-- Redirection (après tracking autorisé) -->
    <script>
        const DESTINATION_URL = "https://wuilhome.com";
        setTimeout(() => {
            window.location.href = DESTINATION_URL;
        }, 300);
    </script>

    <style>
        body {
            font-family: 'Futura', sans-serif;
            background-color: #FEF7EC;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .loader {
            text-align: center;
            color: #11120F;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #FEF7EC;
            border-top-color: #FE7D54;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Redirection en cours...</p>
    </div>
</body>
</html>
